name: Build & Release Windows App (tvbox_win)

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Also create a GitHub Release for this run"
        type: boolean
        default: false
  push:
    branches: [windows]
    tags:
      - "windows-v*"

permissions:
  contents: write

defaults:
  run:
    shell: pwsh

env:
  NODE_VERSION: "22.22.2"
  JDK_VERSION: "21"
  # runner 上 Python 默认 stdout 编码是 cp1252，中文测试输出会 UnicodeEncodeError
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  build:
    runs-on: windows-latest
    name: Build TVBoxOSC portable + installer
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve app version
        run: |
          $ver = "0.0.0-dev"
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $ver = $env:GITHUB_REF_NAME -replace '^windows-v', ''
          }
          "APP_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "APP_VERSION=$ver"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # jlink 需要一个完整 JDK（不是 JRE），用于生成捆绑的精简 JRE
      - name: Setup JDK (for jlink)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JDK_VERSION }}
          architecture: x64

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: pip-${{ runner.os }}-${{ hashFiles('windows-app/requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Install dependencies
        working-directory: windows-app
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Smoke test (imports resolve)
        working-directory: windows-app
        run: |
          python -c "import tvbox_win, tvbox_win.crawler, tvbox_win.parser, tvbox_win.models, tvbox_win.config, tvbox_win.spider_bridge, tvbox_win.js_bridge, tvbox_win.ui.main_window, tvbox_win.ui.detail_dialog, tvbox_win.ui.player_dialog, tvbox_win.ui.source_dialog; from tvbox_win.ui.main_window import MainWindow; print('IMPORTS_OK')"

      # ---- 爬虫运行时冒烟测试（本地 HTTP 站点，无需外网）----
      # 用系统 JDK 跑 JVM spider 链路；Node 已随 runner 自带
      - name: Runtime smoke test (CatVod spider / JVM)
        working-directory: windows-app
        run: python spider_smoke.py

      - name: Runtime smoke test (JS rule source / Node)
        working-directory: windows-app
        run: python js_smoke.py

      - name: Build app (PyInstaller onedir)
        working-directory: windows-app
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed `
            --name TVBoxOSC `
            --icon installer/app.ico `
            --collect-all tvbox_win `
            --collect-all PySide6 `
            build_entry.py

      - name: Verify build output
        working-directory: windows-app
        run: |
          if (-not (Test-Path 'dist/TVBoxOSC/TVBoxOSC.exe')) {
            throw "dist/TVBoxOSC/TVBoxOSC.exe not found"
          }
          Get-ChildItem dist/TVBoxOSC | Select-Object Name, Length

      # ---- 装配爬虫运行时：jlink 精简 JRE + Node + spider jar + host.js ----
      - name: Assemble crawler runtime (jlink JRE + Node + spider jar)
        working-directory: windows-app
        run: |
          ./scripts/prepare_runtime.ps1 -AppDir dist/TVBoxOSC -NodeVersion $env:NODE_VERSION

      - name: Verify bundled runtime layout
        working-directory: windows-app
        run: |
          $need = @('dist/TVBoxOSC/jre/bin/java.exe',
                    'dist/TVBoxOSC/node/node.exe',
                    'dist/TVBoxOSC/spider/spider-runtime.jar',
                    'dist/TVBoxOSC/js-runtime/host.js')
          foreach ($f in $need) {
            if (-not (Test-Path $f)) { throw "missing bundled runtime file: $f" }
            Get-Item $f | Select-Object FullName, Length
          }
          $total = [math]::Round(((Get-ChildItem dist/TVBoxOSC -Recurse |
                     Measure-Object Length -Sum).Sum / 1MB), 1)
          Write-Host "dist/TVBoxOSC total size: $total MB"

      # 用「打包后的目录布局」再跑一遍两个运行时，确认安装包形态下可用
      - name: Verify packaged runtime layout works
        working-directory: windows-app
        run: python packaged_verify.py dist/TVBoxOSC

      - name: Pack portable zip
        working-directory: windows-app
        run: |
          Compress-Archive -Path 'dist/TVBoxOSC/*' -DestinationPath "dist/TVBoxOSC-${env:APP_VERSION}-windows-x64-portable.zip" -Force
          Get-Item "dist/TVBoxOSC-${env:APP_VERSION}-windows-x64-portable.zip" | Select-Object Name, Length

      - name: Fetch Simplified Chinese installer language
        working-directory: windows-app/installer
        run: |
          $url = 'https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/Unofficial/ChineseSimplified.isl'
          try {
            Invoke-WebRequest -Uri $url -OutFile 'ChineseSimplified.isl' -UseBasicParsing -ErrorAction Stop
            Write-Host 'ChineseSimplified.isl downloaded'
          } catch {
            Write-Warning "Chinese language file download failed ($($_.Exception.Message)); installer will be English-only"
          }

      - name: Compile installer (Inno Setup)
        working-directory: windows-app
        shell: pwsh
        run: |
          $iscc = (Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
                                   "${env:ProgramFiles}\Inno Setup 6\ISCC.exe" -ErrorAction SilentlyContinue |
                    Select-Object -First 1).FullName
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = (Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
                                     "${env:ProgramFiles}\Inno Setup 6\ISCC.exe" -ErrorAction SilentlyContinue |
                      Select-Object -First 1).FullName
          }
          if (-not $iscc) { throw "ISCC.exe not found after installing Inno Setup" }
          Write-Host "Using ISCC: $iscc"
          & $iscc "/DMyAppVersion=${env:APP_VERSION}" installer/tvbox_win.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed with exit code $LASTEXITCODE" }
          Get-ChildItem installer/output | Select-Object Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TVBoxOSC-Windows-${{ env.APP_VERSION }}
          path: |
            windows-app/dist/*.zip
            windows-app/installer/output/*.exe
          if-no-files-found: error

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/windows-v') || (github.event_name == 'workflow_dispatch' && inputs.release == true)
        uses: softprops/action-gh-release@v2
        with:
          name: TVBoxOSC ${{ env.APP_VERSION }}
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('windows-v{0}', env.APP_VERSION) }}
          files: |
            windows-app/dist/*.zip
            windows-app/installer/output/*.exe
            windows-app/spider-runtime/dist/spider-runtime.jar
          body: |
            ## TVBoxOSC for Windows ${{ env.APP_VERSION }}

            ### 安装版 (推荐)
            - `TVBoxOSC_Setup_${{ env.APP_VERSION }}.exe` — Windows 安装包（Inno Setup），安装到 Program Files，含开始菜单快捷方式与卸载程序，可选桌面图标。

            ### 便携版
            - `TVBoxOSC-*-portable.zip` — 解压即用，无需安装。

            ### 爬虫运行时
            - `spider-runtime.jar` — CatVod spider（`csp_*` Java 爬虫）运行时，等价配置的 `spider` 字段指向本资产；桌面版已内置，无需手动下载。

            ### 内置爬虫运行时
            - `jre/` 精简 JRE（jlink）—— 运行 `csp_*` Java 爬虫，用户无需自装 Java
            - `node/node.exe` —— 运行 `js:` JS 规则源
            - `spider/spider-runtime.jar`、`js-runtime/host.js` —— 两个运行时宿主
            - `config/tvbox-win.json` —— 等效配置（官方 XPath 规则源 + 公开 HTTP 接口源）

            系统要求：Windows 10/11 x64
          generate_release_notes: true
